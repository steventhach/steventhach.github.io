<!DOCTYPE html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Skip-It Planner by CartMi</title><link rel="canonical" href="https://worthitedit.com/cartmi/hate-christmas-shopping/"><meta name="robots" content="noindex,follow"><style>
:root{--f950:#052e1f;--f900:#0b3d2a;--f800:#12503a;--f700:#176547;--f100:#e3f1ea;--f50:#f2f8f5;
--c700:#a50f24;--c600:#c8102e;--c500:#dc2f45;--c50:#fdecee;--cream:#fff7ee;--paper:#fffdf9;--ink:#1a1814;--muted:#5c564c;--gold:#c9a227;--gold50:#fbf4dc;--line:#ead9c4}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.68;font-size:1.0625rem}
a{color:var(--c700);text-underline-offset:2px}a:hover{color:var(--c600)}
img,svg{max-width:100%;height:auto}

.wrap{max-width:46rem;margin:0 auto;padding:0 1.1rem}

.byline{font-size:.85rem;color:#bfdccd;margin:0}

.pull{font-size:1.35rem;line-height:1.35;font-weight:750;color:var(--c700);border-top:3px solid var(--c600);border-bottom:3px solid var(--c600);padding:.8rem 0;margin:1.8rem 0;text-align:center}

.closing h2{color:#fff;margin-top:0}.closing .cta{background:#fff;color:var(--c700)!important;box-shadow:0 6px 0 #6d0a18}.closing .cta-note{color:#ffe3e7}
figure{margin:1.6rem 0}
figure.phone{display:flex;flex-direction:column;align-items:center}
figure.phone img{width:min(100%,330px);border-radius:1.4rem;border:8px solid var(--f950);box-shadow:0 14px 30px rgba(5,46,31,.22);background:#fff}
figcaption{font-size:.86rem;color:var(--muted);margin-top:.6rem;text-align:center;max-width:34rem}
table{width:100%;border-collapse:collapse;font-size:.93rem;margin:1rem 0 1.4rem;background:var(--paper);border-radius:.8rem;overflow:hidden}
th,td{padding:.55rem .6rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--f900);color:#fff;font-size:.82rem;letter-spacing:.03em}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tool{background:var(--paper);border:3px solid var(--f900);border-radius:1.2rem;padding:1rem 1rem .8rem;margin:1.6rem 0;box-shadow:0 10px 0 var(--f100)}
.tool .badge{display:inline-block;background:var(--c600);color:#fff;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .55rem;border-radius:.35rem}
.tool h3{margin:.5rem 0 .3rem;font-size:1.3rem;color:var(--f950)}
.tool label{display:block;font-weight:650;font-size:.92rem;margin:.6rem 0 .2rem}
.tool input,.tool select{width:100%;font-size:1rem;padding:.6rem .65rem;border:1.5px solid #cdbfa9;border-radius:.6rem;background:#fff;color:var(--ink)}
.tool .row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}

.tool button.alt{background:#fff;color:var(--f800);border:1.5px solid var(--f800)}

.related a b{display:block;color:var(--f900)}.related a span{font-size:.88rem;color:var(--muted)}
.sources{font-size:.86rem;color:var(--muted)}.sources li{margin:.25rem 0}

@media print{header.site,.hero-art,.cta,.cta-soft,.closing,.decision,.steal,footer.site,.toc{display:none!important}body{background:#fff}}
.skgrid{display:grid;grid-template-columns:1fr;gap:.45rem;margin:.4rem 0 .8rem}
@media(min-width:560px){.skgrid{grid-template-columns:1fr 1fr}}

.cta-top:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 104% 108%,rgba(201,162,39,.4) 0 16%,transparent 17%),radial-gradient(circle at 8% 100%,rgba(255,255,255,.12) 0 22%,transparent 23%);pointer-events:none}
.cta-top h2{color:#fff;margin:.1rem 0 .45rem;font-size:clamp(1.25rem,4.4vw,1.55rem)}

.vs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:1rem 0}

.founder{position:relative;background:var(--paper);border:2px solid var(--gold);border-left:8px solid var(--gold);border-radius:1rem;padding:1.3rem 1.1rem .5rem;margin:1.6rem 0 1.2rem;box-shadow:0 6px 18px rgba(11,61,42,.08)}
.founder .ftag{position:absolute;top:-.8rem;left:.9rem;background:var(--f900);color:#fff;font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:.18rem .6rem;border-radius:.35rem}
.founder .fhead{font-size:clamp(1.2rem,4.4vw,1.4rem);font-weight:850;color:var(--f900);line-height:1.25;margin:.1rem 0 .6rem}
.founder p{font-size:1rem}.founder .fsig{font-style:italic;color:var(--muted);text-align:right;margin:0 0 .6rem}
.script{background:var(--paper);border:2px dashed var(--gold);border-radius:1rem;padding:.8rem 1rem;margin:1rem 0;font-style:italic}body{background:#fff}.tool{margin:.5rem}</style></head><body><div class="tool" id="tool"><span class="badge">Steal This</span><h3>The Skip-It Planner</h3><p style="font-size:.93rem;margin:.2rem 0 .5rem">Tick everything you can't stand about Christmas shopping. You get a short plan that skips those parts, in the order to do them.</p><form id="sk-form"><div class="skgrid"><label class="skopt"><input type="checkbox" name="h" value="crowds"> <span>Crowds and parking</span></label><label class="skopt"><input type="checkbox" name="h" value="lines"> <span>Lines at the register</span></label><label class="skopt"><input type="checkbox" name="h" value="choices"> <span>Too many choices, endless tabs</span></label><label class="skopt"><input type="checkbox" name="h" value="noidea"> <span>Not knowing what to get people</span></label><label class="skopt"><input type="checkbox" name="h" value="money"> <span>Doing the budget math</span></label><label class="skopt"><input type="checkbox" name="h" value="many"> <span>Too many people to buy for</span></label><label class="skopt"><input type="checkbox" name="h" value="ship"> <span>Wrapping, shipping and deadlines</span></label></div><button type="submit">Build my skip plan</button></form><div class="out" id="sk-out" aria-live="polite">Pick at least one. (Picking all seven is allowed. We get it.)</div></div><p style="font-size:13px;text-align:center">Skip-It Planner by <a href="https://worthitedit.com/cartmi/hate-christmas-shopping/" target="_top">CartMi</a></p><script>(function(){var f=document.getElementById("sk-form");if(!f)return;
var P={money:["Write one number first.","Decide the total you can pay without a January balance, then split it per person. Our <a href='../how-much-to-spend-on-christmas-gifts/'>how-much-to-spend guide</a> has a free splitter."],
many:["Shrink the list before you shop.","Suggest a name draw for the adults so everyone buys one good gift instead of six small ones. Kids stay on the list."],
noidea:["Ask, don't guess.","Text everyone for 3 to 5 ideas, any price, with a reply-by date. No reply? Pick from their hobbies, not from a 'top gifts' list."],
choices:["Cap the choices.","One person at a time, three options max, pick one, close the tabs. If it isn't on their list or tied to something they love, skip it."],
crowds:["Shop from home.","Do the whole list online. If one gift truly needs a store, order ahead for pickup and go at an off-peak time."],
lines:["Skip the register.","Online orders shipped to the door, or to the recipient directly, mean no checkout line at all."],
ship:["Put the deadlines on the fridge.","USPS recommends sending by Dec 17 (Ground Advantage), Dec 18 (Priority) or Dec 19 (Priority Mail Express) for delivery before Dec 25 in the lower 48. Ship straight to out-of-town people."]};
var order=["money","many","noidea","choices","crowds","lines","ship"];
f.addEventListener("submit",function(e){e.preventDefault();var c=[].slice.call(f.querySelectorAll("input:checked")).map(function(x){return x.value});var o=document.getElementById("sk-out");
if(!c.length){o.innerHTML="Pick at least one thing you'd like to skip.";return;}
var li=order.filter(function(k){return c.indexOf(k)>-1}).map(function(k){return "<li><strong>"+P[k][0]+"</strong> "+P[k][1]+"</li>"}).join("");
o.innerHTML="<p><strong>Your skip plan ("+c.length+" of 7 skipped):</strong></p><ol>"+li+"</ol><p class='final'><strong>Last step:</strong> most of this plan is what CartMi does in one go: one budget, everyone's lists, one pick per person, one Amazon cart that's built to stay under the cap. <a href='https://cartmi.app?utm_source=blog&amp;utm_medium=organic&amp;utm_campaign=hate-christmas-shopping'>Try it free from the couch</a>.</p>";});})();</script></body></html>
